services:
  postgres:
    image: postgres:16
    container_name: after_sales_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7
    container_name: after_sales_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"

  api:
    image: node:22-alpine
    container_name: after_sales_api
    restart: always
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-a123456}
    volumes:
      - ../apps/api:/app
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  web:
    image: nginx:alpine
    container_name: after_sales_web
    restart: always
    volumes:
      - ../apps/web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
