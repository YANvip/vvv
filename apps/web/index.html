<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网店售后中台</title>
  <style>
    :root{--ink:#18202f;--line:#d9dee8;--paper:#fff;--bg:#f3f6fb;--blue:#2559d6;--green:#0f8a5f;--red:#d93025}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei",Arial,sans-serif}
    header{height:64px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    h1{font-size:20px;margin:0}.sub{font-size:13px;color:#cbd5e1}
    main{display:grid;grid-template-columns:430px 1fr;gap:16px;padding:16px}
    section{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px}
    h2{font-size:16px;margin:0 0 12px}.hint{font-size:12px;color:#64748b}
    textarea,input,select{width:100%;box-sizing:border-box;border:1px solid #cfd6e2;border-radius:6px;padding:10px;font-size:14px}
    textarea{min-height:96px;resize:vertical}label{display:block;margin:10px 0 5px;font-size:13px;color:#475569}
    button{border:0;border-radius:6px;background:var(--blue);color:#fff;padding:10px 14px;cursor:pointer;font-size:14px}
    button.secondary{background:#475569}button.green{background:var(--green)}button.red{background:var(--red)}
    .row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.actions{display:flex;gap:8px;margin-top:10px}
    .result{background:#f8fafc;border:1px dashed #b8c1d1;border-radius:8px;padding:12px;margin-top:12px}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e5e7eb;padding:9px;text-align:left;white-space:nowrap}
    th{background:#f8fafc}.tag{display:inline-block;background:#fff2c2;color:#8a5a00;border-radius:999px;padding:3px 8px}
    @media(max-width:980px){main{grid-template-columns:1fr}table{display:block;overflow:auto}}
  </style>
</head>
<body>
  <header>
    <div><h1>网店售后中台</h1><div class="sub">一句话识别 / 打单协作 / 补发换货退件</div></div>
    <div class="sub">当前版本：规则识别原型</div>
  </header>
  <main>
    <section>
      <h2>客服一句话录入</h2>
      <textarea id="rawText" placeholder="例如：260708-560380003972903 补发两个6600灰"></textarea>
      <div class="actions">
        <button onclick="parseText()">识别</button>
        <button class="green" onclick="createFromText()">识别并建单</button>
      </div>
      <div id="parseResult" class="result hint">识别结果会显示在这里。</div>
    </section>
    <section>
      <h2>售后记录</h2>
      <div class="row">
        <input id="keyword" placeholder="搜索订单号、商品、快递单号">
        <select id="status"><option value="">全部状态</option><option value="need_review">待确认</option><option value="pending">待处理</option><option value="processing">处理中</option><option value="done">已完成</option></select>
        <button class="secondary" onclick="loadCases()">刷新</button>
      </div>
      <table>
        <thead><tr><th>售后单</th><th>平台</th><th>订单号</th><th>类型</th><th>状态</th><th>商品</th><th>数量</th><th>快递单号</th><th>备注</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script>
    const api = '/api';
    let cases = [];
    const statusText = s => ({need_review:'待确认',pending:'待处理',processing:'处理中',done:'已完成'}[s] || s || '');
    async function parseText(){
      const text = document.getElementById('rawText').value;
      const data = await (await fetch(api + '/parse', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})).json();
      document.getElementById('parseResult').innerHTML = `
        <b>平台：</b>${data.platform || ''}<br>
        <b>订单号：</b>${data.orderNo || ''}<br>
        <b>类型：</b>${data.type || ''}<br>
        <b>商品：</b>${data.productName || data.model || ''}<br>
        <b>数量：</b>${data.quantity || 1}<br>
        <b>颜色：</b>${data.color || '无'}<br>
        <b>提示：</b>${(data.warnings || []).join('；') || '识别正常'}
      `;
    }
    async function createFromText(){
      const text = document.getElementById('rawText').value;
      await fetch(api + '/cases/from-text', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
      document.getElementById('rawText').value = '';
      await loadCases();
    }
    function render(){
      const keyword = document.getElementById('keyword').value.toLowerCase();
      const status = document.getElementById('status').value;
      const rows = cases.filter(x => (!status || x.status === status) && JSON.stringify(x).toLowerCase().includes(keyword));
      document.getElementById('rows').innerHTML = rows.map(x => `<tr><td>${x.case_no}</td><td>${x.platform||''}</td><td>${x.order_no||''}</td><td>${x.type||''}</td><td><span class="tag">${statusText(x.status)}</span></td><td>${x.product_name||''}</td><td>${x.quantity||1}</td><td>${x.resend_tracking_no||x.return_tracking_no||''}</td><td>${x.remark||''}</td></tr>`).join('');
    }
    async function loadCases(){cases = await (await fetch(api + '/cases')).json(); render();}
    document.getElementById('keyword').oninput = render;
    document.getElementById('status').onchange = render;
    loadCases();
  </script>
</body>
</html>
